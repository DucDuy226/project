<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Học web chuẩn</title>
<style>
/* Reset */
* {
    margin: 0;
    padding: 0;
}
ul {
    list-style: none;
}
body {
    color: #6e6e6e;
    font-family: Helvetica, sans-serif;
    font-size: 16px;
    line-height: 1.8;
}

/* Viết độc lập các thành phần form, để sử dụng lại */
input[type="text"],
input[type="email"],
textarea {
    border: 1px solid #ccc;
    border-radius: 3px;
    box-shadow: 0 1px 1px 0 #ddd inset;
    /* Cần cho full-width */
    box-sizing: border-box;
    color: #6e6e6e;
    padding-left: 20px;
}
input[type="text"],
input[type="email"] {
    height: 40px;
}
textarea {
    padding-top: 10px;
}
